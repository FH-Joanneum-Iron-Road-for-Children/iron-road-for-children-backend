name: Build Quarkus Container
run-name: ${{ github.actor }} builds quarkus container
on:
  push:
    branches:
      - develop
    tags:
      - 'v*.*'

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    if: startsWith(github.ref, 'refs/heads/develop')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push container (test tag)
        run: mvn package -Dquarkus.profile=prod -Dquarkus.container-image.additional-tags=test

  build-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push container (test tag)
        run: mvn package -Dquarkus.profile=prod -Dquarkus.container-image.additional-tags=latest